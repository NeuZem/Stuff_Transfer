name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows first: that is what the lab PCs run.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `npm ci` runs the `prepare` script, which builds dist/.
      - run: npm ci
      - run: npm test

  package:
    # Check the published package actually contains what the CLI needs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm pack
      - name: Install the packed tarball and run it
        run: |
          mkdir /tmp/try && cd /tmp/try
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/stuff-transfer-*.tgz
          npx stuff-transfer --version
          npx stuff-transfer --help
